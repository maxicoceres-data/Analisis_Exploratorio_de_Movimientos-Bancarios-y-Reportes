[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "analisis-gastos-personales"
version = "0.1.0"
description = "Herramientas para análisis exploratorio y optimización de finanzas personales"
readme = "README.md"
requires-python = ">=3.8"
authors = [
    {name = "Maximiliano Coceres", email = "maximiliano.g.coceres@gmail.com"}
]
keywords = ["finanzas", "análisis", "EDA", "gastos personales", "ahorro"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Personal Use",
    "Topic :: Office/Business :: Financial",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
]

dependencies = [
    "pandas>=1.5.0",
    "numpy>=1.24.0",
    "matplotlib>=3.5.0",
    "seaborn>=0.12.0",
]

[project.optional-dependencies]
dev = [
    "jupyter>=1.0.0",
    "ipykernel>=6.0.0",
]
viz = [
    "plotly>=5.0.0",
]

[project.urls]
Homepage = "https://github.com/maximilianococeres-prog/EDA---An-lisis-exploratorio-gastos-ingresos-y-evoluci-n-del-saldo"
Documentation = "https://github.com/maximilianococeres-prog/EDA---An-lisis-exploratorio-gastos-ingresos-y-evoluci-n-del-saldo/blob/main/README.md"

[tool.setuptools]
packages = ["src"]

[tool.setuptools.package-data]
src = ["py.typed"]